plugins {
    id("org.jetbrains.kotlin.jvm") version "2.4.10"
    id("com.google.devtools.ksp") version "2.3.11"
    id("org.jetbrains.kotlin.plugin.allopen") version "2.4.10"
    id("org.jetbrains.kotlin.plugin.jpa") version "2.4.10"
    id("groovy")                              // keep — needed for Spock tests
    id("io.micronaut.application") version "5.0.2"
    id("com.gradleup.shadow") version "9.6.1"
    id("io.micronaut.openapi") version "5.0.2"
    id("org.jlleitschuh.gradle.ktlint") version "14.2.0"
    id("codenarc")
    id("de.aaschmid.cpd") version "3.5"
    id("io.github.ben-manes.versions") version "0.61.0"
}

version = "1.0.0"
group = "org.leargon.backend"

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // Kotlin
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("org.jetbrains.kotlin:kotlin-reflect")
    implementation("io.micronaut.kotlin:micronaut-kotlin-runtime")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    // Micronaut 5's serde stack moved to Jackson 3 (tools.jackson.*); declare Jackson 2 explicitly
    // for the version-snapshot ObjectMapper used directly in BusinessEntityService/ProcessService/BusinessDomainService.
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.2")
    implementation("io.micronaut:micronaut-management")

    // Security and JWT
    implementation("io.micronaut.security:micronaut-security-jwt")
    implementation("io.micronaut.reactor:micronaut-reactor")

    // Database
    implementation("io.micronaut.data:micronaut-data-hibernate-jpa")
    implementation("io.micronaut.sql:micronaut-jdbc-hikari")
    implementation("io.micronaut.sql:micronaut-hibernate-jpa")
    runtimeOnly("com.mysql:mysql-connector-j:26.7.0")

    // Database migrations
    implementation("io.micronaut.liquibase:micronaut-liquibase")

    // Validation
    implementation("io.micronaut.validation:micronaut-validation")
    implementation("org.hibernate.validator:hibernate-validator:9.1.3.Final")

    // OpenAPI Generator dependencies
    implementation("org.openapitools:jackson-databind-nullable:0.2.11")

    // Retry support (for deadlock mitigation)
    implementation("io.micronaut:micronaut-retry")

    // OpenAPI Documentation
    implementation("io.micronaut.openapi:micronaut-openapi")
    implementation("io.swagger.core.v3:swagger-annotations")

    // Azure Entra ID token validation
    implementation('com.nimbusds:nimbus-jose-jwt:10.9.1')

    // Password hashing. spring-security-crypto needs spring-core (StringUtils) on the classpath,
    // but does not pull it transitively, so declare it explicitly — unversioned, so it is managed
    // by micronaut-spring-bom → spring-framework-bom (resolves to 7.0.7). spring-core 7.0.7 in turn
    // brings real commons-logging transitively (Spring 7 dropped the spring-jcl shim), so no
    // separate commons-logging/spring-jcl declaration is needed.
    implementation('org.springframework.security:spring-security-crypto:7.1.1')
    implementation('org.springframework:spring-core')

    runtimeOnly("ch.qos.logback:logback-classic")

    // Annotation processors via KSP — processes both Kotlin AND Java sources (unlike KAPT)
    // micronaut-serde-processor generates @Serdeable introspections for generated Java model classes
    ksp("io.micronaut.serde:micronaut-serde-processor")
    ksp("io.micronaut:micronaut-http-validation")
    ksp("io.micronaut.data:micronaut-data-processor")


    // Test dependencies
    testImplementation("io.micronaut:micronaut-http-client")
    testRuntimeOnly("com.h2database:h2")

    // E2E test dependencies (Testcontainers)
    testImplementation("org.testcontainers:testcontainers:2.0.5")
    testImplementation("org.testcontainers:testcontainers-mysql:2.0.5")
    testImplementation("org.testcontainers:testcontainers-spock:2.0.5")
    testRuntimeOnly("com.mysql:mysql-connector-j:26.7.0")
}

// The CVE force-overrides that used to live here are gone: the Micronaut 5.1 BOM already
// resolves logback 1.5.37 (>= 1.5.34, closing GHSA-p47f-322f-whfh and GHSA-jhq6-gfmj-v8fx)
// and commons-lang3 3.20.0 (CVE-2025-48924). The old block pinned logback to 1.5.32 and had
// itself become the reason we were exposed - re-check every force pin below against the BOM
// on each upgrade sweep and delete it once upstream has caught up.
//
// Hibernate is pinned to the 7.3 line. Micronaut 5.1 ships Hibernate 7.4.4, whose new
// CollectionFetchPaginationQueryTransformer (absent from 7.3.x) builds derived-table column
// aliases by concatenating the join qualifier onto the *already-rendered* column expression.
// For the twelve entities mapped as @Column(name = "`key`") that yields the invalid alias
// be1_0.d1_0_`key` — prefix outside the quotes. Confirmed broken on real MySQL 8.4, not just
// H2: POST /business-entities returns 500 "You have an error in your SQL syntax ... near
// '`key`,d1_0_names'". Still present in 7.4.7. Same defect family as HHH-20588 (fixed 7.4.3)
// and HHH-20789 (open), both reported for @Formula rather than quoted names.
// Renaming the column is not a fix: `key` is reserved in MySQL, so it has to stay quoted.
// Re-test without this force on each new Hibernate release and drop it once upstream renders
// quoted identifiers correctly again.
configurations.configureEach {
    resolutionStrategy.force(
        "org.hibernate.orm:hibernate-core:7.3.13.Final",
        "org.hibernate.orm:hibernate-platform:7.3.13.Final"
    )
}

// Upgrade test code to Groovy 5 + Spock 2.4 — scoped to test configs only.
// The 'codenarc' configuration is intentionally excluded: CodeNarc 3.7.0 uses
// its own Groovy 3 classpath and must not be affected by this force.
configurations.matching { c ->
    c.name.startsWith('test') || c.name.startsWith('e2eTest')
}.configureEach {
    resolutionStrategy {
        force("org.apache.groovy:groovy:5.0.8")
        eachDependency { details ->
            if (details.requested.group == 'org.spockframework' && details.requested.name == 'spock-core') {
                details.useVersion('2.4-groovy-5.0')
                details.because('Groovy 5 compatible Spock')
            }
        }
    }
}

application {
    mainClass = "org.leargon.backend.ApplicationKt"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
        freeCompilerArgs.addAll("-Xjsr305=strict")
    }
}

allOpen {
    annotation("jakarta.inject.Singleton")
    annotation("jakarta.transaction.Transactional")
    annotation("io.micronaut.http.annotation.Controller")
    annotation("jakarta.persistence.Entity")
    annotation("jakarta.persistence.MappedSuperclass")
}

sourceSets {
    main {
        kotlin.srcDirs = ["src/main/kotlin"]
        // Include generated OpenAPI Java sources so compileJava sees them for joint compilation.
        // Kotlin/KAPT references them via compileGeneratedOpenApiSources pre-compilation.
        java.srcDir("build/generated/openapi/generateServerOpenApiApis/src/main/java")
        java.srcDir("build/generated/openapi/generateServerOpenApiModels/src/main/java")
    }
    test {
        groovy.srcDirs = ["src/test/groovy"]
    }
    e2eTest {
        groovy {
            srcDir 'src/test/groovy'
            include 'org/leargon/backend/e2e/**'
        }
        resources {
            srcDir 'src/test/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
    // Classpath for pre-compiling OpenAPI-generated Java sources — extends implementation
    // (not compileClasspath, to avoid circular dependency via the compileOnly generatedOpenApi files).
    openApiPrecompile {
        extendsFrom(configurations.implementation)
    }
}

tasks.register('e2eTest', Test) {
    description = 'Runs E2E tests with Testcontainers (requires Docker)'
    group = 'verification'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    include '**/*E2ESpec*'
}

// Exclude E2E tests from the regular test task
tasks.named('test') {
    exclude 'org/leargon/backend/e2e/**'
}

// KSP processes all Java sources in the main source set (including generated OpenAPI files).
// Ensure the OpenAPI generation tasks run before KSP so the Java files exist.
afterEvaluate {
    tasks.named("kspKotlin").configure {
        dependsOn("generateServerOpenApiApis", "generateServerOpenApiModels")
    }
}

// Pre-compile OpenAPI-generated Java sources (they have no Kotlin deps) so Kotlin/KAPT can reference them.
// The generated Java API/model files only depend on framework jars (Micronaut, Jakarta), not on our Kotlin code.
// compileJava will also compile them as part of the normal build; this pre-compilation step
// only serves to put them on compileClasspath before Kotlin compilation starts.
def generatedOpenApiClassesDir = layout.buildDirectory.dir("classes/java/generatedOpenApi")

tasks.register("compileGeneratedOpenApiSources", JavaCompile) {
    description = "Pre-compiles OpenAPI-generated Java sources for Kotlin compilation"
    dependsOn("generateServerOpenApiApis", "generateServerOpenApiModels")
    source(layout.buildDirectory.dir("generated/openapi/generateServerOpenApiApis/src/main/java"))
    source(layout.buildDirectory.dir("generated/openapi/generateServerOpenApiModels/src/main/java"))
    // micronaut-serde-jackson (impl) is on runtimeClasspath which includes micronaut-serde-api,
    // so @Serdeable resolves; filter out compiled class dirs to avoid circular dependencies.
    classpath = configurations.runtimeClasspath
        .filter { !it.path.contains("classes${File.separator}kotlin") && !it.path.contains("classes${File.separator}java") }
    destinationDirectory = generatedOpenApiClassesDir
    options.release = 25
}

// Add pre-compiled generated classes to the compile classpath so Kotlin tasks see them
dependencies {
    compileOnly(files(generatedOpenApiClassesDir) { builtBy("compileGeneratedOpenApiSources") })
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    filesMatching('app-version.properties') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [version: project.version as String])
    }
}

ktlint {
    version = "1.8.0"
    android = false
    reporters {
        reporter("plain")
        reporter("checkstyle")
        reporter("sarif")
    }
    filter {
        // Only lint hand-written Kotlin sources, not generated OpenAPI files
        exclude { entry -> entry.file.path.contains("build/generated") }
    }
}

codenarc {
    toolVersion = "3.7.0"
    configFile = file("config/codenarc/codenarc.xml")
    reportFormat = "html"
}

// Only run CodeNarc on test sources (main sources are Kotlin, not Groovy)
tasks.named("codenarcMain") { enabled = false }

cpd {
    minimumTokenCount = 80   // ~5-8 lines of Kotlin
    ignoreFailures = true    // report only; not wired into build lifecycle
}

tasks.named('cpdCheck', de.aaschmid.gradle.plugins.cpd.Cpd) {
    language = 'kotlin'
    source = fileTree('src/main/kotlin')
    reports {
        xml.required = false
        text.required = true
    }
}

micronaut {
    version = "5.1.2"
    runtime("netty")
    testRuntime("spock2")
    processing {
        incremental(true)
        annotations("org.leargon.backend.*")
    }
    openapi {
        server(file("src/main/resources/openapi.yaml")) {
            apiPackageName = "org.leargon.backend.api"
            modelPackageName = "org.leargon.backend.model"
            useReactive = false
            useAuth = true
        }
    }
}
