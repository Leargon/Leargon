databaseChangeLog:
  - changeSet:
      id: 079-unify-localised-text-columns
      author: leargon
      comment: >-
        Make every column backing a List<LocalizedText> behave the same: NOT NULL with an empty JSON
        array as its default. These are the localised strings users type, and they had drifted apart —
        some columns NOT NULL (capabilities.names, classifications.names, service_providers.names),
        most nullable, none with a default, and it_systems.names/descriptions nullable in the schema
        despite being annotated nullable = false in JPA (Liquibase owns the DDL, so the annotation was
        decorative).

        That drift is not cosmetic. A non-null Kotlin property over a nullable column throws the
        moment a NULL appears: it took GET /processing-register down (retention_period, left NULL by
        migration 061) and remains latent wherever a later addColumn skipped the backfill
        (organisational_units.mission_statement, migration 064).

        Each column is backfilled BEFORE its constraint — the pattern migration 058 gets right and 064
        omitted. Both steps are idempotent, so re-running changes nothing. MySQL 8.4 supports
        expression defaults on TEXT/JSON (8.0.13+).

        Columns whose Kotlin property is legitimately nullable are NOT touched here; this changeset is
        exactly the set backing List<LocalizedText>.

        NOT NULL alone is not enough. A value can be non-NULL and still unreadable: '' , '   ', or
        legacy plain text such as 'P30D' left from before migration 061 — the LONGTEXT columns are not
        validated by MySQL, so anything survives there. Jackson then fails with "Could not deserialize
        string to java type: java.util.List<LocalizedText>", which is a 400 on the whole endpoint, not
        a degraded row: /processing-register, /business-entities and even POST all stop working. This
        was reproduced by rehearsing the changeset against a seeded pre-079 database.

        Note that 061's own wrap could not catch everything: its guard was
        NOT (TRIM(col) LIKE '[%' AND TRIM(col) LIKE '%]'), so a literal value like '[TBD]' looked
        array-shaped and was skipped. Testing JSON_VALID/JSON_TYPE instead rescues those too.

        The rescue step therefore normalises by SHAPE, before the constraints are applied:
          • '' or whitespace-only   -> '[]'                       (no text to preserve)
          • a JSON scalar string    -> [{"locale": <default>, "text": <unquoted>}]
          • raw non-JSON text       -> [{"locale": <default>, "text": <value>}]   (text preserved)
          • already a JSON array    -> untouched
          • any other shape         -> UNTOUCHED, deliberately. An object, number or boolean is not
            guessed at and never blanked; the migration does not fail either. Find leftovers with:
              SELECT COUNT(*) FROM <table>
               WHERE NOT JSON_VALID(<col>) OR JSON_TYPE(<col>) <> 'ARRAY';
            run per column, before upgrading (how much will be wrapped) and after (what needs a human).

        Rescued text is tagged with the tenant's default locale (the subselect migration 062 uses).
        That is safe: LocalizedTextResolution.textForLocale() falls back to any non-blank entry, so a
        mis-tagged entry is still displayed — never lost.
      changes:
        # ── backfill: no localised column may hold NULL ────────────────────────────────
        - sql:
            dbms: mysql
            sql: |
              UPDATE bounded_contexts            SET names = '[]'                    WHERE names IS NULL;
              UPDATE bounded_contexts            SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE business_data_quality_rules SET description = '[]'              WHERE description IS NULL;
              UPDATE business_domains            SET names = '[]'                    WHERE names IS NULL;
              UPDATE business_domains            SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE business_domains            SET vision_statement = '[]'         WHERE vision_statement IS NULL;
              UPDATE business_entities           SET names = '[]'                    WHERE names IS NULL;
              UPDATE business_entities           SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE business_entities           SET retention_period = '[]'         WHERE retention_period IS NULL;
              UPDATE business_entity_relationships SET descriptions = '[]'           WHERE descriptions IS NULL;
              UPDATE capabilities                SET names = '[]'                    WHERE names IS NULL;
              UPDATE capabilities                SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE classifications             SET names = '[]'                    WHERE names IS NULL;
              UPDATE classifications             SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE classification_values       SET names = '[]'                    WHERE names IS NULL;
              UPDATE classification_values       SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE context_relationships       SET upstream_role = '[]'            WHERE upstream_role IS NULL;
              UPDATE context_relationships       SET downstream_role = '[]'          WHERE downstream_role IS NULL;
              UPDATE context_relationships       SET description = '[]'              WHERE description IS NULL;
              UPDATE domain_events               SET names = '[]'                    WHERE names IS NULL;
              UPDATE domain_events               SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE dpia                        SET risk_description = '[]'         WHERE risk_description IS NULL;
              UPDATE dpia                        SET measures = '[]'                 WHERE measures IS NULL;
              UPDATE dpia                        SET fdpic_consultation_outcome = '[]' WHERE fdpic_consultation_outcome IS NULL;
              UPDATE it_systems                  SET names = '[]'                    WHERE names IS NULL;
              UPDATE it_systems                  SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE organisational_units        SET names = '[]'                    WHERE names IS NULL;
              UPDATE organisational_units        SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE organisational_units        SET mission_statement = '[]'        WHERE mission_statement IS NULL;
              UPDATE process_flow_node           SET label = '[]'                    WHERE label IS NULL;
              UPDATE process_flow_track          SET label = '[]'                    WHERE label IS NULL;
              UPDATE processes                   SET names = '[]'                    WHERE names IS NULL;
              UPDATE processes                   SET descriptions = '[]'             WHERE descriptions IS NULL;
              UPDATE processes                   SET purpose = '[]'                  WHERE purpose IS NULL;
              UPDATE processes                   SET security_measures = '[]'        WHERE security_measures IS NULL;
              UPDATE processes                   SET activity_justification = '[]'   WHERE activity_justification IS NULL;
              UPDATE service_providers           SET names = '[]'                    WHERE names IS NULL;
              UPDATE team_interactions           SET notes = '[]'                    WHERE notes IS NULL;
              UPDATE translation_links           SET semantic_difference_note = '[]' WHERE semantic_difference_note IS NULL;
        # ── rescue: a non-NULL value that is not a JSON array is text we must not lose ─
        # LONGTEXT columns are unvalidated by MySQL, so they can hold raw text. JSON_OBJECT (rather
        # than 061's CONCAT + JSON_QUOTE) escapes quotes, backslashes and newlines by construction.
        # The ELSE branch returns the column unchanged: shapes we cannot convert confidently are left
        # exactly as they are. The default-locale subselect reads a different table than the one being
        # updated, which is what makes it legal in MySQL.
        - sql:
            dbms: mysql
            sql: |
              UPDATE bounded_contexts SET names = CASE WHEN TRIM(names) = '' THEN '[]' WHEN JSON_VALID(names) AND JSON_TYPE(names) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHEN NOT JSON_VALID(names) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', names)) ELSE names END WHERE names IS NOT NULL AND (NOT JSON_VALID(names) OR JSON_TYPE(names) <> 'ARRAY');
              UPDATE bounded_contexts SET descriptions = CASE WHEN TRIM(descriptions) = '' THEN '[]' WHEN JSON_VALID(descriptions) AND JSON_TYPE(descriptions) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHEN NOT JSON_VALID(descriptions) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', descriptions)) ELSE descriptions END WHERE descriptions IS NOT NULL AND (NOT JSON_VALID(descriptions) OR JSON_TYPE(descriptions) <> 'ARRAY');
              UPDATE business_data_quality_rules SET description = CASE WHEN TRIM(description) = '' THEN '[]' WHEN JSON_VALID(description) AND JSON_TYPE(description) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(description))) WHEN NOT JSON_VALID(description) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', description)) ELSE description END WHERE description IS NOT NULL AND (NOT JSON_VALID(description) OR JSON_TYPE(description) <> 'ARRAY');
              UPDATE business_domains SET vision_statement = CASE WHEN TRIM(vision_statement) = '' THEN '[]' WHEN JSON_VALID(vision_statement) AND JSON_TYPE(vision_statement) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(vision_statement))) WHEN NOT JSON_VALID(vision_statement) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', vision_statement)) ELSE vision_statement END WHERE vision_statement IS NOT NULL AND (NOT JSON_VALID(vision_statement) OR JSON_TYPE(vision_statement) <> 'ARRAY');
              UPDATE business_entities SET retention_period = CASE WHEN TRIM(retention_period) = '' THEN '[]' WHEN JSON_VALID(retention_period) AND JSON_TYPE(retention_period) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(retention_period))) WHEN NOT JSON_VALID(retention_period) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', retention_period)) ELSE retention_period END WHERE retention_period IS NOT NULL AND (NOT JSON_VALID(retention_period) OR JSON_TYPE(retention_period) <> 'ARRAY');
              UPDATE context_relationships SET upstream_role = CASE WHEN TRIM(upstream_role) = '' THEN '[]' WHEN JSON_VALID(upstream_role) AND JSON_TYPE(upstream_role) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(upstream_role))) WHEN NOT JSON_VALID(upstream_role) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', upstream_role)) ELSE upstream_role END WHERE upstream_role IS NOT NULL AND (NOT JSON_VALID(upstream_role) OR JSON_TYPE(upstream_role) <> 'ARRAY');
              UPDATE context_relationships SET downstream_role = CASE WHEN TRIM(downstream_role) = '' THEN '[]' WHEN JSON_VALID(downstream_role) AND JSON_TYPE(downstream_role) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(downstream_role))) WHEN NOT JSON_VALID(downstream_role) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', downstream_role)) ELSE downstream_role END WHERE downstream_role IS NOT NULL AND (NOT JSON_VALID(downstream_role) OR JSON_TYPE(downstream_role) <> 'ARRAY');
              UPDATE context_relationships SET description = CASE WHEN TRIM(description) = '' THEN '[]' WHEN JSON_VALID(description) AND JSON_TYPE(description) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(description))) WHEN NOT JSON_VALID(description) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', description)) ELSE description END WHERE description IS NOT NULL AND (NOT JSON_VALID(description) OR JSON_TYPE(description) <> 'ARRAY');
              UPDATE domain_events SET names = CASE WHEN TRIM(names) = '' THEN '[]' WHEN JSON_VALID(names) AND JSON_TYPE(names) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHEN NOT JSON_VALID(names) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', names)) ELSE names END WHERE names IS NOT NULL AND (NOT JSON_VALID(names) OR JSON_TYPE(names) <> 'ARRAY');
              UPDATE domain_events SET descriptions = CASE WHEN TRIM(descriptions) = '' THEN '[]' WHEN JSON_VALID(descriptions) AND JSON_TYPE(descriptions) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHEN NOT JSON_VALID(descriptions) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', descriptions)) ELSE descriptions END WHERE descriptions IS NOT NULL AND (NOT JSON_VALID(descriptions) OR JSON_TYPE(descriptions) <> 'ARRAY');
              UPDATE dpia SET risk_description = CASE WHEN TRIM(risk_description) = '' THEN '[]' WHEN JSON_VALID(risk_description) AND JSON_TYPE(risk_description) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(risk_description))) WHEN NOT JSON_VALID(risk_description) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', risk_description)) ELSE risk_description END WHERE risk_description IS NOT NULL AND (NOT JSON_VALID(risk_description) OR JSON_TYPE(risk_description) <> 'ARRAY');
              UPDATE dpia SET measures = CASE WHEN TRIM(measures) = '' THEN '[]' WHEN JSON_VALID(measures) AND JSON_TYPE(measures) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(measures))) WHEN NOT JSON_VALID(measures) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', measures)) ELSE measures END WHERE measures IS NOT NULL AND (NOT JSON_VALID(measures) OR JSON_TYPE(measures) <> 'ARRAY');
              UPDATE dpia SET fdpic_consultation_outcome = CASE WHEN TRIM(fdpic_consultation_outcome) = '' THEN '[]' WHEN JSON_VALID(fdpic_consultation_outcome) AND JSON_TYPE(fdpic_consultation_outcome) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(fdpic_consultation_outcome))) WHEN NOT JSON_VALID(fdpic_consultation_outcome) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', fdpic_consultation_outcome)) ELSE fdpic_consultation_outcome END WHERE fdpic_consultation_outcome IS NOT NULL AND (NOT JSON_VALID(fdpic_consultation_outcome) OR JSON_TYPE(fdpic_consultation_outcome) <> 'ARRAY');
              UPDATE it_systems SET names = CASE WHEN TRIM(names) = '' THEN '[]' WHEN JSON_VALID(names) AND JSON_TYPE(names) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHEN NOT JSON_VALID(names) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', names)) ELSE names END WHERE names IS NOT NULL AND (NOT JSON_VALID(names) OR JSON_TYPE(names) <> 'ARRAY');
              UPDATE it_systems SET descriptions = CASE WHEN TRIM(descriptions) = '' THEN '[]' WHEN JSON_VALID(descriptions) AND JSON_TYPE(descriptions) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHEN NOT JSON_VALID(descriptions) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', descriptions)) ELSE descriptions END WHERE descriptions IS NOT NULL AND (NOT JSON_VALID(descriptions) OR JSON_TYPE(descriptions) <> 'ARRAY');
              UPDATE organisational_units SET mission_statement = CASE WHEN TRIM(mission_statement) = '' THEN '[]' WHEN JSON_VALID(mission_statement) AND JSON_TYPE(mission_statement) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(mission_statement))) WHEN NOT JSON_VALID(mission_statement) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', mission_statement)) ELSE mission_statement END WHERE mission_statement IS NOT NULL AND (NOT JSON_VALID(mission_statement) OR JSON_TYPE(mission_statement) <> 'ARRAY');
              UPDATE process_flow_node SET label = CASE WHEN TRIM(label) = '' THEN '[]' WHEN JSON_VALID(label) AND JSON_TYPE(label) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(label))) WHEN NOT JSON_VALID(label) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', label)) ELSE label END WHERE label IS NOT NULL AND (NOT JSON_VALID(label) OR JSON_TYPE(label) <> 'ARRAY');
              UPDATE process_flow_track SET label = CASE WHEN TRIM(label) = '' THEN '[]' WHEN JSON_VALID(label) AND JSON_TYPE(label) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(label))) WHEN NOT JSON_VALID(label) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', label)) ELSE label END WHERE label IS NOT NULL AND (NOT JSON_VALID(label) OR JSON_TYPE(label) <> 'ARRAY');
              UPDATE processes SET purpose = CASE WHEN TRIM(purpose) = '' THEN '[]' WHEN JSON_VALID(purpose) AND JSON_TYPE(purpose) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(purpose))) WHEN NOT JSON_VALID(purpose) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', purpose)) ELSE purpose END WHERE purpose IS NOT NULL AND (NOT JSON_VALID(purpose) OR JSON_TYPE(purpose) <> 'ARRAY');
              UPDATE processes SET security_measures = CASE WHEN TRIM(security_measures) = '' THEN '[]' WHEN JSON_VALID(security_measures) AND JSON_TYPE(security_measures) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(security_measures))) WHEN NOT JSON_VALID(security_measures) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', security_measures)) ELSE security_measures END WHERE security_measures IS NOT NULL AND (NOT JSON_VALID(security_measures) OR JSON_TYPE(security_measures) <> 'ARRAY');
              UPDATE processes SET activity_justification = CASE WHEN TRIM(activity_justification) = '' THEN '[]' WHEN JSON_VALID(activity_justification) AND JSON_TYPE(activity_justification) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(activity_justification))) WHEN NOT JSON_VALID(activity_justification) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', activity_justification)) ELSE activity_justification END WHERE activity_justification IS NOT NULL AND (NOT JSON_VALID(activity_justification) OR JSON_TYPE(activity_justification) <> 'ARRAY');
              UPDATE team_interactions SET notes = CASE WHEN TRIM(notes) = '' THEN '[]' WHEN JSON_VALID(notes) AND JSON_TYPE(notes) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(notes))) WHEN NOT JSON_VALID(notes) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', notes)) ELSE notes END WHERE notes IS NOT NULL AND (NOT JSON_VALID(notes) OR JSON_TYPE(notes) <> 'ARRAY');
              UPDATE translation_links SET semantic_difference_note = CASE WHEN TRIM(semantic_difference_note) = '' THEN '[]' WHEN JSON_VALID(semantic_difference_note) AND JSON_TYPE(semantic_difference_note) = 'STRING' THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(semantic_difference_note))) WHEN NOT JSON_VALID(semantic_difference_note) THEN JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', semantic_difference_note)) ELSE semantic_difference_note END WHERE semantic_difference_note IS NOT NULL AND (NOT JSON_VALID(semantic_difference_note) OR JSON_TYPE(semantic_difference_note) <> 'ARRAY');
        # ── rescue, JSON-typed columns ────────────────────────────────────────────────
        # MySQL rejects invalid JSON on write here, so raw text cannot be present; the only damaged
        # shape is a JSON scalar string ("Sales" rather than [{"locale":…,"text":"Sales"}]), which
        # Jackson fails on identically. Same treatment as migration 061 gave nested notes.
        - sql:
            dbms: mysql
            sql: |
              UPDATE business_domains SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE business_domains SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE business_entities SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE business_entities SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE business_entity_relationships SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE capabilities SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE capabilities SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE classifications SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE classifications SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE classification_values SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE classification_values SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE organisational_units SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE organisational_units SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE processes SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
              UPDATE processes SET descriptions = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(descriptions))) WHERE descriptions IS NOT NULL AND JSON_TYPE(descriptions) = 'STRING';
              UPDATE service_providers SET names = JSON_ARRAY(JSON_OBJECT('locale', COALESCE((SELECT locale_code FROM supported_locales WHERE is_default = 1 LIMIT 1), 'en'), 'text', JSON_UNQUOTE(names))) WHERE names IS NOT NULL AND JSON_TYPE(names) = 'STRING';
        # ── constrain: NOT NULL with an empty array as the default ─────────────────────
        # MODIFY preserves each column's existing type (some JSON, some LONGTEXT) — deliberately not
        # normalised here, since converting types on populated tables is the risky part and buys nothing.
        - sql:
            dbms: mysql
            sql: |
              ALTER TABLE bounded_contexts            MODIFY names LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE bounded_contexts            MODIFY descriptions LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE business_data_quality_rules MODIFY description LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE business_domains            MODIFY names JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE business_domains            MODIFY descriptions JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE business_domains            MODIFY vision_statement LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE business_entities           MODIFY names JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE business_entities           MODIFY descriptions JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE business_entities           MODIFY retention_period LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE business_entity_relationships MODIFY descriptions JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE capabilities                MODIFY names JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE capabilities                MODIFY descriptions JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE classifications             MODIFY names JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE classifications             MODIFY descriptions JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE classification_values       MODIFY names JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE classification_values       MODIFY descriptions JSON NOT NULL DEFAULT ('[]');
              ALTER TABLE context_relationships       MODIFY upstream_role LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE context_relationships       MODIFY downstream_role LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE context_relationships       MODIFY description LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE domain_events               MODIFY names LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE domain_events               MODIFY descriptions LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE dpia                        MODIFY risk_description LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE dpia                        MODIFY measures LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE dpia                        MODIFY fdpic_consultation_outcome LONGTEXT NOT NULL DEFAULT ('[]');
              ALTER TABLE it_systems                  MODIFY names LONGTEXT NOT NULL DEFAULT ('[]');
